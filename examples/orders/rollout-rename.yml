schema_version: 1
name: orders-column-rename
postgres_image: postgres:17
schema_path: schema/base.sql
fixtures_path: fixtures/orders.yml
seed: 42
contracts:
  deployed: contracts/deployed-v1.yml
  candidate: contracts/candidate-v2.yml
migrations:
- id: rename-user-name
  path: migrations/rename_user_name.sql
  transaction: transaction
timeouts:
  startup_seconds: 60
  statement_ms: 5000
  lock_ms: 1000
rollout:
  persistent_old_sessions: 2
  phases:
  - id: mixed_versions
    operations:
    - id: old-write
      actor: deployed
      sql: UPDATE orders SET amount_cents=12501 WHERE id=101 RETURNING id,amount_cents
      expect:
        rows:
        - - 101
          - 12501
        row_count: 1
    - id: new-read
      actor: candidate
      sql: SELECT id,amount_cents FROM orders WHERE id=101
      expect:
        rows:
        - - 101
          - 12501
        row_count: 1
    - id: new-write
      actor: candidate
      sql: UPDATE orders SET amount_cents=12502 WHERE id=101 RETURNING id,amount_cents
      expect:
        rows:
        - - 101
          - 12502
        row_count: 1
    - id: old-read
      actor: deployed
      sql: SELECT id,amount_cents FROM orders WHERE id=101
      expect:
        rows:
        - - 101
          - 12502
        row_count: 1
  - id: candidate_only
    operations:
    - id: target-read
      actor: candidate
      sql: SELECT id,amount_cents FROM orders WHERE id=101
      expect:
        rows:
        - - 101
          - 12502
        row_count: 1
  - id: app_rollback
    operations:
    - id: candidate-write
      actor: candidate
      sql: UPDATE orders SET amount_cents=12503 WHERE id=101 RETURNING id,amount_cents
      expect:
        rows:
        - - 101
          - 12503
        row_count: 1
    - id: old-read
      actor: deployed
      sql: SELECT id,amount_cents FROM orders WHERE id=101
      expect:
        rows:
        - - 101
          - 12503
        row_count: 1
