name: PostgreSQL rehearsal and installed packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment manager
        run: python -m pip install uv==0.12.7
      - name: Install locked project, tests and build backend
        run: uv sync --locked --python python
      - name: Lint, format and type checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
      - name: Prepare the verified PostgreSQL image
        run: |
          docker pull postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          docker tag postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 postgres:17
      - name: Build the matching isolated worker
        run: docker build -f docker/worker.Dockerfile -t pg-rehearse-worker:0.1.0 .
      - name: Unit and real PostgreSQL regression
        run: uv run --locked pytest --run-docker --basetemp=.pg-rehearse/pytest --junitxml=.pg-rehearse/test-results.xml
      - name: Labeled migration evaluation
        run: uv run --locked python scripts/evaluate.py
      - name: Build reproducible distributions with locked backend
        run: uv run --locked python -m build --no-isolation
      - name: Install wheel and source distribution outside the checkout
        run: uv run --locked python scripts/check_distributions.py
      - name: Installed package summary
        if: always()
        run: |
          for summary in .pg-rehearse/evaluation/summary.md .pg-rehearse/package-check/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain verification and expected-failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsal-python-${{ matrix.python }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .pg-rehearse/test-results.xml
            .pg-rehearse/pytest/**/report.json
            .pg-rehearse/pytest/**/report.md
            .pg-rehearse/pytest/**/report.html
            .pg-rehearse/evaluation/summary.json
            .pg-rehearse/evaluation/summary.md
            .pg-rehearse/evaluation/*/*/report.json
            .pg-rehearse/evaluation/*/*/report.md
            .pg-rehearse/evaluation/*/*/report.html
            .pg-rehearse/package-check/summary.md
            .pg-rehearse/package-check/packaging.log
            .pg-rehearse/package-check/*/*/*/report.json
            .pg-rehearse/package-check/*/*/*/report.md
            .pg-rehearse/package-check/*/*/*/report.html
            dist/*.whl
            dist/*.tar.gz
