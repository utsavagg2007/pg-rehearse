name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install environment manager
        run: python -m pip install uv==0.12.7
      - name: Install locked project and development dependencies
        run: uv sync --locked --python python
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Type checks
        run: uv run --locked mypy
      - name: Foundation tests
        run: uv run --locked pytest --junitxml=.pg-rehearse/test-results.xml
      - name: CLI checks
        run: |
          uv run --locked pg-rehearse --version
          uv run --locked pg-rehearse doctor --skip-docker
          uv run --locked pg-rehearse validate --config examples/orders/rehearsal.yml
          uv run --locked pg-rehearse validate --config examples/orders/control.yml
      - name: Build distributions
        run: uv build
      - name: Retain foundation test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-results-python-${{ matrix.python }}
          path: .pg-rehearse/test-results.xml
          if-no-files-found: ignore
